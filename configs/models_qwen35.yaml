# Qwen 3.5 model configuration
# Usage: --models-config configs/models_qwen35.yaml
#
# Qwen3.5-35B-A3B: MoE, 35B total / 3B active, Gated DeltaNet + MoE
#   - Better tool-calling, reasoning, instruction following vs Qwen3-30B-A3B
#   - Same memory footprint (~18GB at 4-bit), fits 1 A100-40GB
#
# Qwen3.5-122B-A10B: MoE, 122B total / 10B active
#   - Replaces Qwen3-Next-80B-A3B as eval judge
#   - MMLU-Pro 86.7, GPQA 86.6, TAU2-Bench 79.5
#   - ~61GB at 4-bit, needs 2 A100-40GB (tensor parallel)

models:
  target:
    name: "Qwen/Qwen3.5-35B-A3B"
    backend: "vllm"
    gpu: 0
    quantization: "bitsandbytes"
    gpu_memory_utilization: 0.80
    port: 8001
    max_model_len: 12288
    temperature: 0.3
    max_tokens: 512

  judge:
    name: "Qwen/Qwen3.5-35B-A3B"
    backend: "vllm"
    gpu: 0
    port: 8001  # shared server with target
    max_model_len: 2048
    temperature: 0.0
    max_tokens: 256

  auditor:
    name: "Qwen/Qwen3-4B-Instruct-2507"
    backend: "transformers"
    gpu: 1
    quantization: "bitsandbytes-4bit"
    max_new_tokens: 256
    temperature: 0.8
    lora:
      rank: 64
      alpha: 128
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      dropout: 0.05

  judge_eval:
    name: "Qwen/Qwen3.5-122B-A10B"
    backend: "vllm"
    gpu: [2, 3]
    quantization: "bitsandbytes"
    port: 8002
    gpu_memory_utilization: 0.90
    max_model_len: 2048
    temperature: 0.0
    max_tokens: 256
