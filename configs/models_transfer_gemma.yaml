# Cross-family transfer eval (bwc6 Q2): Qwen-trained auditor vs a Gemma target.
#
# Preferred over the Llama option: DeepSeek-R1-Distill-Llama-8B is a *reasoning*
# model (emits <think> traces) and behaves oddly as a booking agent, whereas
# gemma-3-4b-it is a clean instruction-tuned agent from a genuinely different
# family (Google). The auditor (Qwen3-4B QLoRA, DPO-V3 s300) was trained ONLY
# against the Qwen3-30B SkyAssist target; here it audits Gemma with no retraining.
# The judge is held FIXED at Qwen3-30B (same as the paper) so coverage stays
# comparable across target conditions; only the target family changes.
#
# vLLM serves gemma-3 via --tool-call-parser functiongemma (Gemma-specific
# function-calling parser shipped with vLLM). Gemma3ForConditionalGeneration is
# in this vLLM build's supported-arch list (Gemma4 is NOT, which is why the
# cached gemma-4-E4B-it could not be used).
#
# GPU layout (2x A100-40GB):
#   GPU 0: Qwen3-30B judge      (vLLM, port 8001)
#   GPU 1: Gemma-3-4B target    (vLLM, port 8003) + Qwen3-4B auditor
models:
  target:
    name: "google/gemma-3-4b-it"
    backend: "vllm"
    gpu: 1
    quantization: "bitsandbytes"
    gpu_memory_utilization: 0.45
    port: 8003
    tool_call_parser: "functiongemma"
    max_model_len: 8192
    temperature: 0.3
    max_tokens: 512

  judge:
    name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
    backend: "vllm"
    gpu: 0
    port: 8001
    max_model_len: 2048
    temperature: 0.0
    max_tokens: 256

  auditor:
    name: "Qwen/Qwen3-4B-Instruct-2507"
    backend: "transformers"
    gpu: 1
    quantization: "bitsandbytes-4bit"
    max_new_tokens: 256
    temperature: 0.8
    lora:
      rank: 64
      alpha: 128
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      dropout: 0.05
