models:
  target:
    name: "gpt-4o-mini"
    backend: "openai"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.3
    max_tokens: 512

  judge:
    name: "Qwen/Qwen3-30B-A3B-Instruct-2507"
    backend: "vllm"
    gpu: 0
    port: 8001
    max_model_len: 2048
    temperature: 0.0
    max_tokens: 256

  auditor:
    name: "Qwen/Qwen3-4B-Instruct-2507"
    backend: "transformers"
    gpu: 1
    quantization: "bitsandbytes-4bit"
    max_new_tokens: 256
    temperature: 0.8
    lora:
      rank: 64
      alpha: 128
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      dropout: 0.05
