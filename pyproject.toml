[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe"
version = "0.1.0"
description = "Policy Rule Observation via Behavioral Exploration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.36",
    "peft>=0.7",
    "trl>=0.7",
    "sentence-transformers>=2.2",
    "hdbscan>=0.8",
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "openai>=1.0",
    "numpy>=1.24",
    "bitsandbytes>=0.43",
    "liger-kernel>=0.5",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.4",
]
perf = [
    "flash-attn>=2.8",
]
api = [
    "litellm>=1.0",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "scienceplots>=2.1",
    "wandb>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
